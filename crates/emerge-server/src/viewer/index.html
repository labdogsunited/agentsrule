<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerge viewer</title>
<style>
  :root {
    --bg: #3b3b3b; --panel: #303030; --line: #202020; --field: #262626; --ink: #ebebeb; --muted: #b6b6b6;
    --accent: #e0a458; --ok: #7bc47f; --bad: #e57373;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  #status { color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #where { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 3px; }
  select, input { width: 100%; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .server { margin-left: auto; display: flex; gap: 8px; }
  button { background: #22262d; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  .checks { display: flex; gap: 14px; }
  .checks label { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; margin: 4px 0; }
  .checks input { width: auto; }
  #stats { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: pre-line; }
  #error { color: var(--bad); font-size: 13px; white-space: pre-wrap; margin-top: 10px; }
  #frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; display: none; user-select: none; -webkit-user-drag: none; }
  #frame.enlarged { image-rendering: pixelated; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #code .bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #code .bar select { width: auto; flex: 1; min-width: 0; }
  #code .bar button { padding: 3px 8px; }
  #codeedit { display: none; flex: 1; flex-direction: column; min-height: 0; }
  body.code-editing #codeedit { display: flex; }
  body.code-editing #codebody { display: none; }
  #codeedit .note { padding: 6px 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  #codeedit textarea { flex: 1; min-height: 120px; resize: none; border: 0; border-radius: 0; background: var(--bg); color: var(--ink); font: 12px/1.55 ui-monospace, monospace; padding: 8px 10px; tab-size: 4; white-space: pre; overflow: auto; }
  #codeedit .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  #codeedit .actions button { padding: 4px 10px; white-space: nowrap; }
  #codeerrors { max-height: 150px; overflow: auto; padding: 0 10px 8px; font: 12px/1.45 ui-monospace, monospace; }
  #codeerrors div { padding: 2px 0; cursor: pointer; }
  #codeerrors .bad { color: var(--bad); }
  #codeerrors .ok { color: var(--ok); }
  #codeerrors .muted { color: var(--muted); }
  #code-world { display: none; }
  #codebody { flex: 1; overflow: auto; font: 12px/1.55 ui-monospace, monospace; padding: 6px 0; tab-size: 4; }
  .cl { display: flex; white-space: pre; }
  .cl .n { flex: none; width: 46px; text-align: right; padding-right: 10px; color: var(--muted); opacity: 0.7; user-select: none; cursor: pointer; }
  .cl .t { flex: 1; padding-right: 14px; }
  .cl.hl { background: #2a2f3a; }
  .cl.hl .n { color: var(--accent); opacity: 1; }
  .cl.flash { animation: flash 2s ease-out; }
  @keyframes flash { from { background: #4a3d1f; } to { background: transparent; } }
  .tk-c { color: #6b7686; font-style: italic; }
  .tk-k { color: #c8a2ea; }
  .tk-l { color: #e0a050; }
  .tk-n { color: #6fbfae; }
  .tk-s { color: #9cc77a; }
  #genome { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: none; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 20px 20px; }
  #genome svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #genome .wire { fill: none; stroke-width: 2; opacity: 0.8; }
  #genome .wire.dim { opacity: 0.12; }
  #genome .wire.hot { stroke-width: 3.5; opacity: 1; }
  #genome .wlabel { font: 10px system-ui, sans-serif; fill: var(--muted); }
  .mod { position: absolute; border: 1px dashed #3a414d; border-radius: 10px; }
  .mod.off { opacity: 0.5; }
  .mod .mt { position: absolute; left: 12px; top: 7px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .gene { position: absolute; width: 200px; height: 60px; background: #1c2027; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; user-select: none; }
  .gene.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .gene.off { opacity: 0.45; }
  .gene .t { padding: 2px 8px; font-size: 12px; font-weight: 600; color: #101318; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 5px 5px 0 0; }
  .gene .b { padding: 4px 8px; font: 11px/1.35 system-ui, sans-serif; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gene.k-sense .t { background: #6f9bd1; }
  .gene.k-regulate .t { background: #b48ad6; }
  .gene.k-react .t { background: #e0a050; }
  .gene.k-action .t { background: #5fbfae; }
  #genomemsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 0 40px; color: var(--muted); font-size: 14px; pointer-events: none; }
  #genomebar { position: absolute; left: 12px; top: 12px; display: none; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; z-index: 3; cursor: default; color: var(--muted); font-size: 12px; max-width: calc(100% - 200px); }
  #genomebar select { width: auto; max-width: 340px; }
  #genomebar button { padding: 3px 8px; }
  body.genome #genomebar { display: flex; }
  main.picking { cursor: crosshair; }
  #pickmark { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 0 1px #000; display: none; pointer-events: none; z-index: 4; }
  #infopanel { position: absolute; display: none; min-width: 210px; max-width: 320px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45; z-index: 5; pointer-events: none; cursor: default; box-shadow: 0 6px 24px #0008; }
  #infopanel.pinned { pointer-events: auto; border-color: var(--accent); }
  #infopanel h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  #infopanel .sub { color: var(--muted); }
  #infopanel table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #infopanel td { padding: 1px 0; }
  #infopanel td:last-child { text-align: right; }
  #infopanel .who { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #infopanel .who button { padding: 1px 8px; margin-top: 3px; font-size: 11px; }
  #infopanel .hint { margin-top: 6px; color: var(--muted); font-size: 11px; }
  .modes { display: flex; gap: 4px; }
  .modes button { padding: 3px 10px; }
  .modes button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  #graph { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: none; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 20px 20px; }
  #graph svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #graph .wire { fill: none; stroke-width: 2; opacity: 0.85; }
  #graph .wlabel { font: 10px system-ui, sans-serif; fill: var(--muted); }
  .box { position: absolute; width: 200px; height: 60px; background: #1c2027; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; user-select: none; }
  .box .b { border-radius: 0 0 6px 6px; }
  .box.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .port { position: absolute; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: #2b313b; border: 2px solid #8b93a1; cursor: crosshair; z-index: 2; }
  .port.in { left: -7px; }
  .port.out { right: -7px; }
  .port:hover, .port.hot { border-color: var(--accent); background: var(--accent); }
  #palette { position: absolute; left: 12px; top: 12px; display: none; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; z-index: 3; cursor: default; color: var(--muted); font-size: 12px; }
  body.graph #palette { display: flex; }
  #palette button { padding: 3px 8px; }
  #palette button:disabled { opacity: 0.4; cursor: default; }
  #picked .params { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin-bottom: 8px; }
  #picked .params label { margin: 0; }
  #picked .params input { padding: 3px 6px; font: 12px ui-monospace, monospace; }
  .box .t { padding: 2px 8px; font-size: 12px; font-weight: 600; color: #101318; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box .b { padding: 4px 8px; font: 11px/1.35 ui-monospace, monospace; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .box.k-store .t { background: #6f9bd1; }
  .box.k-reaction .t { background: #b48ad6; }
  .box.k-transfer .t { background: #5fbfae; }
  .box.k-react .t { background: #e0a050; }
  .box.k-diffuse .t { background: #8cc06a; }
  .box.k-signal .t { background: #d78aa8; }
  .box.k-code, .box.codebox { border-style: dashed; }
  .box.codebox .t { background: #9aa1ad; }
  .box.k-code .t { background: #9aa1ad; }
  .col-head { position: absolute; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #picked { font: 12px/1.4 ui-monospace, monospace; color: var(--ink); white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  #picked textarea { width: 100%; min-height: 90px; resize: vertical; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: inherit; }
  #picked textarea.dirty { border-color: var(--accent); }
  #picked .edit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #picked .edit button { padding: 4px 8px; white-space: nowrap; flex: none; }
  #picked .msg { font: 12px system-ui, sans-serif; margin-top: 6px; white-space: pre-wrap; }
  #picked .msg.bad { color: var(--bad); }
  #picked .msg.ok { color: var(--ok); }
  #picked small { display: block; color: var(--muted); font: 11px system-ui, sans-serif; margin-bottom: 4px; }

  body { overflow: hidden; }
  #desk { flex: 1; display: flex; min-height: 0; }
  #colL { flex: 1; min-width: 200px; display: flex; }
  #colR { flex: none; width: 40%; min-width: 240px; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 0; position: relative; }
  #colL .pane { flex: 1; }
  #pane-parm { flex: 0 0 40%; }
  #pane-net { flex: 1 1 0; }
  .phead { flex: none; height: 28px; display: flex; align-items: stretch; gap: 0; background: var(--panel); border-bottom: 1px solid var(--line); user-select: none; }
  .phead select { align-self: center; width: auto; max-width: 220px; padding: 2px 6px; margin-left: 6px; font-size: 12px; }
  .phead #zoom { align-self: center; padding-right: 10px; color: var(--muted); font-size: 12px; }
  .ptab { display: flex; align-items: center; padding: 0 14px; font: 12px system-ui, sans-serif; color: var(--muted); background: var(--panel); border: 0; border-right: 1px solid var(--line); border-top: 2px solid transparent; border-radius: 0; cursor: pointer; }
  .ptab:hover { color: var(--ink); border-color: var(--line); border-top-color: transparent; }
  .ptab.on { color: var(--ink); background: var(--bg); border-top-color: var(--accent); }
  body.code-open .ptab:not(#codebtn).on { background: var(--panel); color: var(--muted); border-top-color: transparent; }
  .pane:not(.focus) .ptab.on { border-top-color: #777; }
  .pbody { flex: 1; display: flex; min-height: 0; position: relative; }
  .pbody > main { flex: 1; min-width: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
  .tabbody { flex: 1; position: relative; min-height: 0; }
  .tabbody > main { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; display: none; }
  .tabbody > main.vis { display: block; }
  main.dragging { cursor: grabbing; }
  .strip { flex: none; width: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; background: var(--panel); }
  #lstrip { border-right: 1px solid var(--line); }
  #rstrip { border-left: 1px solid var(--line); }
  .strip button { width: 26px; height: 26px; padding: 0; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .strip button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); }
  #flyout { display: none; position: absolute; right: 40px; top: 36px; z-index: 12; width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 10px; box-shadow: 0 6px 24px #0008; }
  #flyout.open { display: block; }
  #flyout .check { display: flex; gap: 6px; align-items: center; color: var(--ink); margin-top: 10px; }
  #flyout .check input { width: auto; }
  .divider { flex: none; background: var(--line); z-index: 3; }
  .divider.v { width: 6px; cursor: col-resize; }
  .divider.h { height: 6px; cursor: row-resize; }
  .divider:hover, .divider.on { background: var(--accent); }
  .hbar { align-self: center; color: var(--muted); font-size: 12px; margin: 0 -8px 0 8px; }
  header select { width: auto; max-width: 240px; padding: 3px 6px; }
  header button { padding: 3px 10px; }
  #newworld { display: none; position: fixed; left: 280px; top: 44px; z-index: 30; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px 14px; box-shadow: 0 8px 28px #000a; }
  #newworld.open { display: block; }
  #newworld h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 4px; }
  #empty button { margin-top: 12px; pointer-events: auto; }
  #parm { flex: 1; overflow-y: auto; padding: 10px 12px; background: var(--panel); display: flex; flex-direction: column; }
  #parm h2, #parm h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  #parm h2:first-child { margin-top: 0; }
  #parm details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
  #parm summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 4px 0; }
  #sel { padding-bottom: 6px; }
  #playbar { flex: none; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #playbar button { padding: 4px 12px; }
  #playbar input { width: 64px; padding: 4px 6px; }
  #playbar #stats { margin-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #playbar #error { margin: 0; color: var(--bad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #code { display: none; position: absolute; inset: 0; z-index: 8; flex-direction: column; background: var(--panel); }
  body.code-open #code { display: flex; }
  #codehandle { display: none; }
  body.codeonly #colL, body.codeonly #dv, body.codeonly #pane-parm, body.codeonly #dh, body.codeonly #pane-net .phead, body.codeonly .tabbody > main, body.codeonly #playbar, body.codeonly .server, body.codeonly #where, body.codeonly .hbar, body.codeonly #world, body.codeonly #newbtn { display: none; }
  body.codeonly #colR { width: auto !important; flex: 1 !important; border-left: 0; }
  body.codeonly #popout { display: none; }
</style>
</head>
<body>
<header><h1>Emerge</h1><span id="status">connecting…</span><label class="hbar" for="world">World</label><select id="world" title="The running world that Play, Step and the editors act on"></select><button id="newbtn" title="Start a new world from an example">New world…</button><span id="where"></span><span class="server"><button id="restart" title="Start the server again. Worlds in memory are lost.">Restart server</button><button id="stop" title="Stop the server. Worlds in memory are lost.">Stop server</button></span></header>
<div id="newworld"><h3>New world</h3>    <label for="example">Start from</label>
    <select id="example"></select>
    <div class="checks" id="lins"></div>
    <div class="row">
      <div><label for="seed">Seed</label><input id="seed" type="number" value="1" min="0"></div>
      <div><label for="size">Grid</label><select id="size"><option value="96">96 × 96</option><option value="256">256 × 256</option></select></div>
    </div>
    <label for="backend">Runs on</label>
    <select id="backend" title="The GPU runs the same world in contract mode (its own exact arithmetic, so numbers differ from the CPU's)"><option value="cpu">CPU</option><option value="gpu">GPU (contract mode)</option></select>
    <p><button class="primary" id="create">Create from the example</button></p>
    </div>
<div id="desk">
  <div id="colL">
    <section class="pane focus" id="pane-picture" data-view="picture">
      <div class="phead"><span class="ptab on">Viewport</span><select id="view" title="Which view of the world to draw"></select><span style="flex:1"></span><span id="zoom" title="Zoom of the focused pane">100%</span></div>
      <div class="pbody">
        <div class="strip" id="lstrip">
          <button id="infobtn" title="Info picker: what is under the pointer (press i)">i</button>
          <button id="zin" title="Zoom in">+</button>
          <button id="zout" title="Zoom out">&minus;</button>
          <button id="fit" title="Fit the view to the pane (double-click does it too)">&#10530;</button>
        </div>
        <main id="stage-picture" data-view="picture"><img id="frame" alt="the current frame" draggable="false"><span id="empty">Create a world, or pick one.<br><button id="newbtn2" class="primary">New world…</button></span><div id="pickmark"></div><div id="infopanel"></div></main>
        <div class="strip" id="rstrip">
          <button id="chartsbtn" class="on" title="Charts under the picture">&#9636;</button>
          <button id="gear" title="Update rate">&#9881;</button>
        </div>
        <div id="flyout">
          <label for="every">Every (ticks)</label><input id="every" type="number" value="5" min="1">
          <label for="fps">Max fps</label><input id="fps" type="number" value="8" min="1" max="30">
          <label class="check"><input type="checkbox" id="charts" checked> Charts</label>
        </div>
      </div>
    </section>
  </div>
  <div class="divider v" id="dv" title="Drag to resize"></div>
  <div id="colR">
    <section class="pane" id="pane-parm">
      <div class="phead"><span class="ptab on">Parameters</span></div>
      <div id="parm">
        <div id="sel">
      <h2>Selected</h2>
      <div id="picked">Click a box in the graph.</div>
      <label for="decls">Other declarations</label>
      <select id="decls"><option value="">–</option></select>
    </div>
    

      </div>
    </section>
    <div class="divider h" id="dh" title="Drag to resize"></div>
    <section class="pane" id="pane-net">
      <div class="phead"><button class="ptab on" id="t-graph">Network</button><button class="ptab" id="t-genome" title="The genome of one living creature: modules, genes and signals">Genome</button><button class="ptab" id="codebtn" title="Show the complete source of the world">Code</button></div>
      <div class="tabbody"><main id="stage-graph" data-view="graph"><div id="graph"></div><div id="palette"><span>Add</span><button data-kind="transfer">transfer</button><button data-kind="react">react</button><button data-kind="diffuse">diffuse</button><button data-kind="code" title="A box to type a statement into">code</button><span style="width:10px"></span><button id="undo" title="Undo the last graph edit (Ctrl+Z)">Undo</button><button id="redo" title="Do it again (Ctrl+Shift+Z)">Redo</button></div></main><main id="stage-genome" data-view="genome"><div id="genome"></div><div id="genomemsg"></div><div id="genomebar"><span>Creature</span><select id="entity"></select><button id="entities-refresh" title="Reload the list of creatures">Reload</button><span id="genomenote"></span></div></main><section id="code">
    <div id="codehandle"></div>
    <div class="bar"><span id="codeinfo">source</span><select id="code-world"></select><span style="flex:1"></span><button id="editcode" title="Edit a copy of the code, or open a file, and make a new world from it">Edit</button><button id="copycode">Copy</button><button id="popout" title="Open the code in its own window">Pop out</button></div>
    <div id="codebody"><span style="padding:10px;color:var(--muted)">Create a world, or pick one.</span></div>
    <div id="codeedit">
      <div class="note">Editing a copy. The running world is not changed until you make a new world from this text. Open any <code>.em</code> file, or write one.</div>
      <textarea id="codetext" spellcheck="false"></textarea>
      <div id="codeerrors"></div>
      <div class="actions">
        <button id="openfile">Open file…</button>

</div>
<footer id="playbar">
  <button id="play" title="Run">&#9654; Play</button><button id="pause">&#10074;&#10074; Pause</button>
  <input id="steps" type="number" value="10" min="1" title="Ticks per step"><button id="step">Step</button>
  <span id="stats">–</span><span id="error"></span>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const say = (text, kind) => { $("status").textContent = text; $("status").className = kind || ""; };
const oops = (e) => { $("error").textContent = e ? String(e.message || e) : ""; };

// The token is in the address's fragment, which the browser never sends to the server.
const token = new URLSearchParams(location.hash.slice(1)).get("k") || "";
let ws, nextId = 0, pending = new Map(), example = { source: "", views: "" }, sub = null, shown = null, poll = null, leaving = null;

function call(method, params = {}) {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
  });
}

// The camera: what is shown (the picture, or the graph) is placed by a translate and a scale, so
// panning and zooming cost nothing on the server. Fit shows the whole thing; after the first wheel
// or drag the camera stays put across updates of the same size. The picture and the graph each
// keep their own camera.
// The info picker (press `i`): what is under the pointer in the picture, asked of the server
// (`view.pick`): the cell's contents and the creatures near the point. A click pins it; its creatures
// open in the Genome tab.
const info = { on: false, map: null, pin: null, hover: null, at: 0, busy: false };
let wantEntity = null;
const newCam = () => ({ s: 1, x: 0, y: 0, fit: true, w: 0, h: 0 });
const cams = { picture: newCam(), graph: newCam(), genome: newCam() };
// `mode` is the focused view (what the zoom label and Fit speak of). The viewport is always on
// screen; the network pane shows the graph or the genome (or the code, `codebtn`).
let mode = "picture";
const visible = { picture: true, graph: true, genome: false };
const isShown = (v) => visible[v];
const stages = { picture: $("stage-picture"), graph: $("stage-graph"), genome: $("stage-genome") };   // the canvases
const stage = stages.picture;   // the picture's stage: the info picker lives there
const viewOf = (cam) => Object.keys(cams).find((k) => cams[k] === cam);
function fitCam(cam = cams[mode]) {
  const r = stages[viewOf(cam)].getBoundingClientRect();
  if (!cam.w || !cam.h || !r.width || !r.height) return;
  cam.s = Math.min(r.width / cam.w, r.height / cam.h);
  if (cam !== cams.picture) cam.s = Math.min(cam.s, 1.5);
  cam.x = (r.width - cam.w * cam.s) / 2;
  cam.y = (r.height - cam.h * cam.s) / 2;
  cam.fit = true;
}
function applyCam(cam = cams[mode]) {
  const el = cam === cams.graph ? $("graph") : cam === cams.genome ? $("genome") : $("frame");
  el.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
  // Exact cells when enlarged; smooth when shrunk, so the legend's text stays readable.
  if (cam === cams.picture) el.classList.toggle("enlarged", cam.s > 1);
  if (cam === cams.picture) placeMark();
  if (cam === cams[mode]) $("zoom").textContent = `${Math.round(cam.s * 100)}%`;
}
// A view that is on screen fits its stage again when the stage changes size (a divider, a tab, the window).
function refitAll() {
  for (const v of Object.keys(cams)) if (visible[v] && cams[v].fit) { fitCam(cams[v]); applyCam(cams[v]); }
}
for (const v of Object.keys(stages)) new ResizeObserver(() => { if (visible[v] && cams[v].fit) { fitCam(cams[v]); applyCam(cams[v]); } }).observe(stages[v]);
function focusView(v) {
  if (mode === v) return;
  mode = v;
  $("pane-picture").classList.toggle("focus", v === "picture");
  $("pane-net").classList.toggle("focus", v !== "picture");
  applyCam(cams[v]);
}
function zoomBy(f) {
  const cam = cams[mode], r = stages[mode].getBoundingClientRect();
  if (!cam.w) return;
  const s = Math.min(64, Math.max(0.05, cam.s * f)), px = r.width / 2, py = r.height / 2;
  cam.x = px - (px - cam.x) * (s / cam.s);
  cam.y = py - (py - cam.y) * (s / cam.s);
  cam.s = s;
  cam.fit = false;
  applyCam(cam);
}
$("zin").onclick = () => zoomBy(1.25);
$("zout").onclick = () => zoomBy(0.8);
let drag = null;
function bindStage(view) {
  const stage = stages[view];
  stage.addEventListener("wheel", (e) => {
    const cam = cams[view];
    if (!cam.w) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const s = Math.min(64, Math.max(0.05, cam.s * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015))));
    cam.x = px - (px - cam.x) * (s / cam.s);
    cam.y = py - (py - cam.y) * (s / cam.s);
    cam.s = s;
    cam.fit = false;
    focusView(view);
    applyCam(cam);
  }, { passive: false });
  stage.addEventListener("pointerdown", (e) => {
    const cam = cams[view];
    focusView(view);
    if (!cam.w || e.button > 1 || e.target.closest("#infopanel")) return;
    const port = view === "graph" && e.target.closest(".port.out");
    const box = view === "graph" && e.target.closest(".box");
    if (port && box) {
      // A wire is pulled from an output port and dropped on a box.
      drag = { wire: box.dataset.id, port };
      port.classList.add("hot");
      e.stopPropagation();
    } else if (box) {
      // A box moves with the pointer; a click without a move selects it.
      const p = placed.get(box.dataset.id);
      drag = { box, p, sx: e.clientX, sy: e.clientY, x0: p.x, y0: p.y, moved: false };
    } else {
      // In the genome view a press on a gene that does not move is a click on it.
      const gene = view === "genome" && e.target.closest(".gene");
      drag = { x: e.clientX - cam.x, y: e.clientY - cam.y, gene: gene ? +gene.dataset.index : null, sx: e.clientX, sy: e.clientY, moved: false };
    }
    stage.setPointerCapture(e.pointerId);
    stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const cam = cams[view];
    if (drag.wire) {
      const r = stage.getBoundingClientRect(), a = placed.get(drag.wire);
      const gx = (e.clientX - r.left - cam.x) / cam.s, gy = (e.clientY - r.top - cam.y) / cam.s;
      let t = $("tempwire");
      if (!t) {
        t = document.createElementNS("http://www.w3.org/2000/svg", "path");
        t.id = "tempwire";
        t.setAttribute("class", "wire");
        t.setAttribute("stroke", "#e6b45c");
        t.setAttribute("stroke-dasharray", "5 4");
        $("wires").appendChild(t);
      }
      const x0 = a.x + BOX.w, y0 = a.y + 15, d = Math.max(40, Math.abs(gx - x0) / 2);
      t.setAttribute("d", `M${x0},${y0} C${x0 + d},${y0} ${gx - d},${gy} ${gx},${gy}`);
      return;
    }
    if (drag.box) {
      const dx = (e.clientX - drag.sx) / cam.s, dy = (e.clientY - drag.sy) / cam.s;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      drag.p.x = drag.x0 + dx;
      drag.p.y = drag.y0 + dy;
      drag.box.style.left = `${drag.p.x}px`;
      drag.box.style.top = `${drag.p.y}px`;
      drawWires();
      return;
    }
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
    cam.x = e.clientX - drag.x;
    cam.y = e.clientY - drag.y;
    cam.fit = false;
    applyCam(cam);
  });
  const drop = (e) => {
    if (drag && !drag.box && !drag.wire && drag.gene == null && !drag.moved && info.on && view === "picture") pinInfo(e);
    if (drag && drag.gene != null && !drag.moved) selectGene(drag.gene);
    if (drag && drag.box && !drag.moved) select(drag.box.dataset.id);
    if (drag && drag.box && drag.moved) savePosition(drag.box.dataset.id);
    if (drag && drag.wire) {
      drag.port.classList.remove("hot");
      const t = $("tempwire");
      if (t) t.remove();
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const to = target && target.closest(".box");
      if (to && to.dataset.id !== drag.wire) graphOp({ op: "wire", from: drag.wire, to: to.dataset.id });
    }
    drag = null;
    stage.classList.remove("dragging");
  };
  stage.addEventListener("pointerup", drop);
  stage.addEventListener("pointercancel", () => { drag = null; stage.classList.remove("dragging"); });
  stage.addEventListener("dblclick", (e) => { if (!e.target.closest(".box")) { fitCam(cams[view]); applyCam(cams[view]); } });
}
for (const v of Object.keys(stages)) bindStage(v);
$("fit").onclick = () => { fitCam(); applyCam(); };
window.addEventListener("resize", refitAll);
// The two dividers: viewport | right column, and Parameters / Network. Sizes are kept per browser.
const layoutState = { rw: null, ph: null };
function saveLayout() { try { localStorage.setItem("layout2", JSON.stringify(layoutState)); } catch (e) {} }
function dragBar(bar, move) {
  bar.addEventListener("pointerdown", (e) => {
    bar.setPointerCapture(e.pointerId);
    bar.classList.add("on");
    const mv = (m) => { move(m); refitAll(); };
    const up = () => { bar.classList.remove("on"); bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); saveLayout(); };
    bar.addEventListener("pointermove", mv);
    bar.addEventListener("pointerup", up);
  });
}
const setRightWidth = (w) => { const box = $("desk").getBoundingClientRect(); layoutState.rw = Math.min(box.width - 260, Math.max(240, w)); $("colR").style.width = `${layoutState.rw}px`; };
const setParmHeight = (h) => { const box = $("colR").getBoundingClientRect(); layoutState.ph = Math.min(box.height - 120, Math.max(60, h)); $("pane-parm").style.flex = `0 0 ${layoutState.ph}px`; };
dragBar($("dv"), (m) => setRightWidth($("desk").getBoundingClientRect().right - m.clientX));
dragBar($("dh"), (m) => setParmHeight(m.clientY - $("colR").getBoundingClientRect().top));
const toggleNew = (on) => $("newworld").classList.toggle("open", on === undefined ? !$("newworld").classList.contains("open") : on);
$("newbtn").onclick = () => toggleNew();
$("newbtn2").onclick = () => toggleNew(true);
$("create").addEventListener("click", () => setTimeout(() => toggleNew(false), 300));
$("gear").onclick = () => $("flyout").classList.toggle("open");
$("chartsbtn").onclick = () => $("charts").click();
$("charts").addEventListener("change", () => $("chartsbtn").classList.toggle("on", $("charts").checked));

// ---- The code window: the complete source of the running world, read-only. A statement or box
// selected in the graph is marked here, a click on a line selects the box that holds it, and lines a
// swap changed flash. It stays current as the world's revision moves. `Pop out` opens the same
// window on its own (`#k=…&code=1`), for a second screen.
const codeonly = new URLSearchParams(location.hash.slice(1)).get("code") === "1";
if (codeonly) document.body.classList.add("codeonly", "code-open");
let codeRev = null, codeLines = [], codeWorldName = null;
const KEYWORDS = new Set("world lineage view chart patch rule ruleset reaction substance element field source sink waste genesis space upkeep limits second_law reaction_space senses actions regulation module gene seed genome profile mutation react transfer diffuse_conserved life_like when else for let in extends catalyze holds signal combine states weight const any on sense action regulate emit take move turn divide remains decompose layer scale palette".split(" "));
const TOKEN = /(\/\/[^\n]*)|(@\w+)|("[^"\n]*")|(\b\d[\d_]*(?:\.\d+)?(?:mu|bp|ms|u)?\b)|(\b[A-Za-z_]\w*\b)/g;
function tokens(line) {
  const out = [];
  let last = 0;
  for (const m of line.matchAll(TOKEN)) {
    if (m.index > last) out.push(["", line.slice(last, m.index)]);
    const cls = m[1] ? "tk-c" : m[2] ? "tk-l" : m[3] ? "tk-s" : m[4] ? "tk-n" : KEYWORDS.has(m[5]) ? "tk-k" : "";
    out.push([cls, m[0]]);
    last = m.index + m[0].length;
  }
  if (last < line.length) out.push(["", line.slice(last)]);
  return out;
}
const codeOpen = () => document.body.classList.contains("code-open");
const codeWorld = () => $("code-world").value || $("world").value;

function renderCode(src, prev) {
  const body = $("codebody"), keep = body.scrollTop;
  body.textContent = "";
  codeLines = src.split("\n");
  if (codeLines.length && codeLines[codeLines.length - 1] === "") codeLines.pop();
  const before = new Map();
  for (const l of prev || []) before.set(l, (before.get(l) || 0) + 1);
  codeLines.forEach((text, i) => {
    const row = document.createElement("div"), n = document.createElement("span"), t = document.createElement("span");
    row.className = "cl";
    row.dataset.line = i + 1;
    n.className = "n";
    n.textContent = i + 1;
    t.className = "t";
    for (const [cls, piece] of tokens(text)) {
      if (!cls) { t.append(document.createTextNode(piece)); continue; }
      const sp = document.createElement("span");
      sp.className = cls;
      sp.textContent = piece;
      t.append(sp);
    }
    if (prev && text.trim()) {
      const k = before.get(text) || 0;
      if (k) before.set(text, k - 1); else row.classList.add("flash");
    }
    row.append(n, t);
    body.append(row);
  });
  body.scrollTop = keep;
}

async function loadCode() {
  const w = codeWorld();
  if (!w || !codeOpen()) return;
  const r = await call("world.source", { world: w });
  const prev = w === codeWorldName ? codeLines : null;
  codeWorldName = w;
  codeRev = r.revision;
  $("codeinfo").textContent = `${w} · revision ${r.revision} · ${r.source.split("\n").length - 1} lines`;
  renderCode(r.source, prev);
  if (selected) highlightCode(selected, false);
}

// The last line of the item that starts at `start` (1-based): to the `;` or `}` that closes it.
function spanEnd(start) {
  let depth = 0, seen = false;
  for (let i = start - 1; i < codeLines.length; i++) {
    const line = codeLines[i].replace(/\/\/.*$/, "");
    for (const c of line) {
      if ("([{".includes(c)) { depth++; seen = true; }
      else if (")]}".includes(c)) { depth--; if (depth <= 0 && seen && c === "}") return i + 1; }
      else if (c === ";" && depth <= 0) return i + 1;
    }
  }
  return start;
}

function highlightCode(id, scroll = true) {
  const rows = $("codebody").querySelectorAll(".cl");
  rows.forEach((r) => r.classList.remove("hl"));
  const n = graphData && graphData.nodes.find((x) => x.id === id);
  if (!n || !n.line || n.line > codeLines.length) return;
  const end = spanEnd(n.line);
  for (let l = n.line; l <= end; l++) rows[l - 1] && rows[l - 1].classList.add("hl");
  if (scroll && rows[n.line - 1]) rows[n.line - 1].scrollIntoView({ block: "center", behavior: "smooth" });
}

$("codebody").addEventListener("click", async (e) => {
  const row = e.target.closest(".cl");
  if (!row) return;
  const line = +row.dataset.line;
  if (!graphData && !codeonly) await loadGraph().catch(() => {});
  if (!graphData) {
    $("codebody").querySelectorAll(".cl").forEach((r) => r.classList.toggle("hl", r === row));
    return;
  }
  // The smallest item that holds the line.
  let best = null, size = Infinity;
  for (const n of graphData.nodes) {
    if (!n.line || n.line > line) continue;
    const end = spanEnd(n.line);
    if (end >= line && end - n.line < size) { best = n; size = end - n.line; }
  }
  if (best) { if (!isShown("graph")) setMode("graph"); select(best.id); }
});

$("codebtn").onclick = () => {
  document.body.classList.toggle("code-open");
  $("codebtn").classList.toggle("on", codeOpen());
  try { localStorage.setItem("emerge.code", codeOpen() ? "1" : "0"); } catch (_) {}
  if (codeOpen()) loadCode().catch(oops);
  window.dispatchEvent(new Event("resize"));
};
$("copycode").onclick = () => navigator.clipboard && navigator.clipboard.writeText(codeLines.join("\n") + "\n").catch(() => {});
$("popout").onclick = () => {
  window.open(`${location.origin}/#k=${token}&code=1`, "emerge-code", "width=780,height=940");
  if (codeOpen()) $("codebtn").click();
};
$("code-world").onchange = () => loadCode().catch(oops);
{
  // The window can be made wider or narrower by its left edge.
  let dragging = null;
  const h = $("codehandle");
  h.addEventListener("pointerdown", (e) => { dragging = { x: e.clientX, w: $("code").getBoundingClientRect().width }; h.setPointerCapture(e.pointerId); });
  h.addEventListener("pointermove", (e) => {

    window.dispatchEvent(new Event("resize"));

}
// ---- Editing a copy of the code, or opening a file: Check shows the errors with their lines, and
// "New world from this text" makes a separate world (the running one is never changed this way; the
// graph is the way to change a running world).
let checked = null;
function codeNote(kind, text, line) {
  const d = document.createElement("div");
  d.className = kind;
  d.textContent = line ? `line ${line}: ${text}` : text;
  if (line) d.onclick = () => {
    const ta = $("codetext"), lines = ta.value.split("\n");
    const start = lines.slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0);
    ta.focus();
    ta.setSelectionRange(start, start + (lines[line - 1] || "").length);
    ta.scrollTop = Math.max(0, (line - 4) * 18.6);

}
async function checkCode() {
  checked = null;
  $("codeerrors").textContent = "";
  const r = await call("world.validate", { source: $("codetext").value });
  if (!r.valid) {
    for (const e of r.errors) codeNote("bad", `${e.code} ${e.message}`, e.line);
    return false;
  }
  checked = r;
  codeNote("ok", `Valid. Lineages: ${r.lineages.join(", ") || "none"}.`);
  for (const l of r.left_out || []) codeNote("muted", `left out of the run: ${l}`);

try { if (!codeonly && localStorage.getItem("emerge.code") === "1") { document.body.classList.add("code-open"); $("codebtn").classList.add("on"); } } catch (_) {}

// ---- The graph (`proposals/node-editor.md`): boxes and wires, a projection of the source text.
// Columns: sources and reactions on the left, the statements of the rules in the middle in the
// order of the tick's steps, stores on the right. Boxes can be moved; the positions are kept for the
// page's lifetime only.
let graphData = null, graphRev = null, selected = null;
const placed = new Map();
const STEPS = ["Field signals", "Transfers", "World reactions"];
const BOX = { w: 200, h: 60, gap: 28 };
const hue = (name) => { let h = 0; for (const c of name || "") h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const wireColor = (name) => (name ? `hsl(${hue(name)} 65% 62%)` : "#8b93a1");

function layoutGraph(g) {
  const col = (n) => (n.kind === "reaction" || (n.kind === "store" && /\.sources\./.test(n.id)) ? 0 : n.kind === "store" ? 2 : 1);
  const drawn = g.nodes.filter((n) => ["store", "reaction", "transfer", "react", "diffuse", "signal", "code"].includes(n.kind));
  const rank = (n) => (n.group ? STEPS.indexOf(n.step) + 1 || 9 : 0);
  const cols = [[], [], []];
  for (const n of drawn) cols[col(n)].push(n);
  cols[1].sort((a, b) => rank(a) - rank(b) || a.line - b.line);
  cols.forEach((list, c) => list.forEach((n, i) => {
    const key = `${g.world}/${n.id}`;
    const saved = g.positions && g.positions[n.id];
    if (!placed.has(key)) placed.set(key, saved ? { x: saved[0], y: saved[1] } : { x: 40 + c * 330, y: 40 + i * (BOX.h + BOX.gap) });
    placed.set(n.id, placed.get(key));
  }));
  return drawn;
}

function drawGraph() {
  const g = graphData, root = $("graph");
  root.textContent = "";
  if (!g) return;
  const drawn = layoutGraph(g);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.id = "wires";
  root.appendChild(svg);
  for (const [c, name] of [[0, "Sources and reactions"], [1, "Rule statements, in tick order"], [2, "Stores"]]) {
    const h = document.createElement("div");
    h.className = "col-head";
    h.style.left = `${40 + c * 330}px`;
    h.style.top = "12px";
    h.textContent = name;
    root.appendChild(h);
  }
  let maxX = 0, maxY = 0;
  for (const n of drawn) {
    const p = placed.get(n.id), el = document.createElement("div");
    el.className = `box k-${n.kind}${/@code_/.test(n.id) ? " codebox" : ""}`;
    el.dataset.id = n.id;
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y}px`;
    const t = document.createElement("div"), b = document.createElement("div");
    t.className = "t";
    t.textContent = /@code_/.test(n.id) ? `code · ${n.title}` : n.group ? `${n.title} · ${n.group.split(".").pop()}` : n.title;
    b.className = "b";
    b.textContent = n.text.replace(/\s+/g, " ");
    el.append(t, b);
    if (["transfer", "react"].includes(n.kind)) { const p = document.createElement("div"); p.className = "port in"; el.append(p); }
    if (["store", "reaction", "transfer"].includes(n.kind)) { const p = document.createElement("div"); p.className = "port out"; el.append(p); }
    root.appendChild(el);
    maxX = Math.max(maxX, p.x + BOX.w + 40);
    maxY = Math.max(maxY, p.y + BOX.h + 40);
  }
  root.style.width = `${maxX}px`;
  root.style.height = `${maxY}px`;
  svg.setAttribute("width", maxX);
  svg.setAttribute("height", maxY);
  const cam = cams.graph;
  if (cam.fit || cam.w !== maxX || cam.h !== maxY) { cam.w = maxX; cam.h = maxY; if (cam.fit) fitCam(cam); }
  drawWires();
  if (selected && !dirty) select(selected);
  else for (const el of $("graph").querySelectorAll(".box")) el.classList.toggle("sel", el.dataset.id === selected);
  if (isShown("graph")) applyCam(cam);
  const other = g.nodes.filter((n) => !["store", "reaction", "transfer", "react", "diffuse", "signal", "code", "rule"].includes(n.kind));
  $("decls").innerHTML = `<option value="">${other.length} declarations</option>` + other.map((n) => `<option value="${n.id}"></option>`).join("");
  [...$("decls").options].slice(1).forEach((o, i) => { o.textContent = `${other[i].id.split(".").slice(1, 3).join(" ")}`; });
}

function drawWires() {
  const g = graphData, svg = $("wires");
  if (!g || !svg) return;
  svg.textContent = "";
  const ends = new Map();
  const slot = (id, side) => { const k = id + side, i = ends.get(k) || 0; ends.set(k, i + 1); return i; };
  const NS = "http://www.w3.org/2000/svg";
  for (const w of g.wires) {
    const a = placed.get(w.from), b = placed.get(w.to);
    if (!a || !b) continue;
    // A wire runs right to left when its source is to the right of its target (a reaction or a
    // diffusion reading a store): it leaves the source's left edge and enters the target's right edge.
    const back = a.x > b.x;
    const x0 = back ? a.x : a.x + BOX.w, x1 = back ? b.x + BOX.w : b.x;
    const y0 = a.y + 14 + (slot(w.from, back ? "L" : "R") % 6) * 8, y1 = b.y + 14 + (slot(w.to, back ? "R" : "L") % 6) * 8;
    const d = Math.max(40, Math.abs(x1 - x0) / 2) * (back ? -1 : 1);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", `M${x0},${y0} C${x0 + d},${y0} ${x1 - d},${y1} ${x1},${y1}`);
    path.setAttribute("stroke", wireColor(w.substance));
    if (!w.substance) path.setAttribute("stroke-dasharray", "4 4");
    svg.appendChild(path);
    // Labels only on the wires into a store from a source or a transfer; the others are told apart by colour.
    if (w.substance && !back && !/^(diffuse|react)$/.test((g.nodes.find((n) => n.id === w.from) || {}).kind)) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "wlabel");
      t.setAttribute("x", (x0 + x1) / 2);
      t.setAttribute("y", (y0 + y1) / 2 - 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = w.substance;
      svg.appendChild(t);
    }
  }
}

// One edit of the graph: the server makes the patch and swaps the running world. A refused edit
// changes nothing and its reason is shown.
async function graphOp(op) {
  oops();
  try {
    const r = await call("world.graph_op", { world: $("world").value, base_revision: graphData.revision, op });
    await loadGraph();
    await loadCode().catch(() => {});
    if (r.selected) { select(r.selected); if (/@code_/.test(r.selected)) { const ta = $("picked").querySelector("textarea"); if (ta) { ta.focus(); ta.select(); } } }
    else if (selected && !graphData.nodes.some((n) => n.id === selected)) select(null);
    return r;
  } catch (e) {
    const m = /^not swappable: (.+?);/.exec(String(e.message || e));
    oops(m ? `The engine cannot swap this into a running world (${m[1]} changed). The world is unchanged; create a new world from the changed source to try it.` : e);
  }
}
// Undo and redo: the server keeps the patch that undoes each graph edit (`world.undo`, `world.redo`).
// A change made some other way can stop an undo from applying; the reason is shown and nothing changes.
function updateHistory() {
  const h = (graphData && graphData.history) || { undo: [], redo: [] };
  $("undo").disabled = !h.undo.length;
  $("redo").disabled = !h.redo.length;
  $("undo").title = h.undo.length ? `Undo: ${h.undo[h.undo.length - 1]} (Ctrl+Z)` : "Nothing to undo";
  $("redo").title = h.redo.length ? `Redo: ${h.redo[h.redo.length - 1]} (Ctrl+Shift+Z)` : "Nothing to redo";
}
async function stepHistory(method) {
  oops();
  try {
    await call(method, { world: $("world").value });
    await loadGraph();
    await loadCode().catch(() => {});
    if (selected && !graphData.nodes.some((n) => n.id === selected)) select(null);
  } catch (e) {
    oops(e);
  }
}
$("undo").onclick = () => stepHistory("world.undo");
$("redo").onclick = () => stepHistory("world.redo");
window.addEventListener("keydown", (e) => {
  if (!isShown("graph") || !(e.ctrlKey || e.metaKey) || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); if (!$("undo").disabled) stepHistory("world.undo"); }
  else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); if (!$("redo").disabled) stepHistory("world.redo"); }
});

function savePosition(id) {

for (const b of document.querySelectorAll("#palette button[data-kind]")) b.onclick = () => graphOp({ op: "add_rule", kind: b.dataset.kind });

// The selected box. A statement is edited in place: Apply sends the new text, the server makes the
// patch and swaps the running world (`world.graph_edit`); a refused edit changes nothing and its
// reason is shown. Other boxes are read-only so far.
// The settable arguments of a box, each an edit of its own (a `set` patch that keeps comments).
function paramsGrid(n) {
  const grid = document.createElement("div");
  grid.className = "params";
  for (const [name, value] of n.params) {
    const l = document.createElement("label"), inp = document.createElement("input");
    l.textContent = name;
    inp.value = value;
    inp.spellcheck = false;
    inp.onchange = () => { if (inp.value !== value) graphOp({ op: "set_param", id: n.id, param: name, value: inp.value }); };
    grid.append(l, inp);
  }
  return grid;
}

let dirty = false;
function select(id) {
  selected = id;
  dirty = false;
  highlightCode(id);
  for (const el of $("graph").querySelectorAll(".box")) el.classList.toggle("sel", el.dataset.id === id);
  const n = graphData && graphData.nodes.find((x) => x.id === id);

  picked.append(small);
  if (!n.group) {
    if (n.params && n.params.length) picked.append(paramsGrid(n));
    picked.append(document.createTextNode(n.text));

  }
  if (n.params && n.params.length) picked.append(paramsGrid(n));
  const ta = document.createElement("textarea"), msg = document.createElement("div"), row = document.createElement("div");

  const doApply = async () => {
    msg.className = "msg";
    msg.textContent = "";
    try {
      await call("world.graph_edit", { world: $("world").value, id: n.id, text: ta.value, base_revision: graphData.revision });
      dirty = false;
      await loadGraph();
      await loadCode().catch(() => {});
      const m = $("picked").querySelector(".msg");
      if (m) { m.className = "msg ok"; m.textContent = `Applied: the world runs the new text (revision ${graphData.revision}).`; }
    } catch (e) {
      msg.className = "msg bad";
      msg.textContent = String(e.message || e);
    }
  };
  apply.onclick = doApply;
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doApply(); } };
  revert.onclick = () => select(n.id);
  row.append(apply, revert, del);
  picked.append(ta, row, msg);
}

// ---- The genome view (`proposals/node-editor.md` N5): one living creature's genes as boxes, in the
// frames of its modules, with the signals between them as wires. Senses are on the left, regulation in
// the middle, reactions and actions on the right, so a wire runs from what the creature perceives to
// what it does. Dormant modules and genes are dimmed. Read-only: the lineage's seed genome is
// changed in the source (the patch language cannot yet edit genes).
let genomeData = null, genomeSel = null, genomeTick = 0;
const gplaced = new Map();
const GCOL = { sense: 0, regulate: 1, react: 2, action: 2 };

// Why there is nothing to draw, in words: no world, nobody alive, a creature that died, or the server's reason.
let genomeMsg = "";
function showGenomeMsg() {
  const el = $("genomemsg");
  el.textContent = genomeMsg;
  el.style.display = isShown("genome") && !genomeData && genomeMsg ? "flex" : "none";
}
const genomeWhy = (e) => String(e.message || e);

async function loadEntities() {
  const w = $("world").value;
  if (!w) { genomeMsg = "Create a world first (or pick one)."; genomeData = null; drawGenome(); return; }
  $("genomenote").textContent = "loading…";
  try {
    const r = await call("entities.query", { world: w, limit: 60 });
    const sel = $("entity"), prev = sel.value;
    sel.textContent = "";
    for (const e of r.entities) {
      const o = document.createElement("option");
      o.value = e.id;
      o.textContent = `#${e.id} · ${e.lineage} · age ${e.age} · ${e.active_genes} genes`;
      sel.append(o);
    }
    if (r.entities.some((e) => String(e.id) === prev)) sel.value = prev;
    if (wantEntity != null) {
      // A creature chosen elsewhere (the info picker) may not be in the sample: add it.
      if (![...sel.options].some((o) => +o.value === wantEntity)) {
        const o = document.createElement("option");
        o.value = wantEntity;
        o.textContent = `#${wantEntity} · picked`;
        sel.prepend(o);
      }
      sel.value = String(wantEntity);
      genomeSel = null;
      wantEntity = null;
    }
    $("genomenote").textContent = r.entities.length ? `${r.total} alive` : "";
    genomeMsg = r.entities.length ? "" : "No creatures are alive in this world.";
  } catch (e) {
    $("entity").textContent = "";
    $("genomenote").textContent = "";
    genomeMsg = genomeWhy(e);
    genomeData = null;
    drawGenome();
  }
}

async function loadGenome(quiet) {
  const w = $("world").value, id = +$("entity").value;
  if (!w || !id) { genomeData = null; drawGenome(); return; }
  try {
    genomeData = await call("genome.graph", { world: w, entity: id });
    genomeMsg = "";
    $("genomenote").textContent = "";
    drawGenome();
  } catch (e) {
    genomeData = null;
    genomeMsg = /no living entity/.test(String(e.message)) ? `Creature #${id} has died. Pick another from the list.` : genomeWhy(e);
    drawGenome();
    if (quiet) loadEntities().catch(() => {});
  }
}

function drawGenome() {
  const g = genomeData, root = $("genome");
  root.textContent = "";
  gplaced.clear();
  if (!g) { cams.genome.w = 0; showGenomeMsg(); return; }
  showGenomeMsg();
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.id = "gwires";
  root.appendChild(svg);
  let y = 24, maxX = 0;
  g.modules.forEach((on, m) => {
    const genes = g.genes.filter((x) => x.module === m);
    if (!genes.length) return;
    const rows = [0, 0, 0];
    for (const x of genes) {
      const c = GCOL[x.kind], k = rows[c]++;
      gplaced.set(x.index, { x: 44 + c * 250, y: y + 34 + k * 74 });
    }
    const h = 34 + Math.max(...rows) * 74 + 4, frame = document.createElement("div");
    frame.className = `mod${on ? "" : " off"}`;
    frame.style.cssText = `left:24px;top:${y}px;width:${3 * 250 + 16}px;height:${h}px`;
    const t = document.createElement("div");
    t.className = "mt";
    t.textContent = `module m${m}${on ? "" : " · dormant"}`;
    frame.append(t);
    root.appendChild(frame);
    y += h + 24;
    maxX = 24 + 3 * 250 + 40;
  });
  for (const x of g.genes) {
    const p = gplaced.get(x.index), el = document.createElement("div"), t = document.createElement("div"), b = document.createElement("div");
    el.className = `gene k-${x.kind}${x.active ? "" : " off"}`;
    el.dataset.index = x.index;
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y}px`;
    t.className = "t";
    t.textContent = x.title + (x.expressed ? "" : " · dormant");
    b.className = "b";
    b.textContent = x.text;
    el.append(t, b);
    if (x.reads.length) { const q = document.createElement("div"); q.className = "port in"; el.append(q); }
    if (x.writes.length) { const q = document.createElement("div"); q.className = "port out"; el.append(q); }
    el.onclick = () => selectGene(x.index);
    root.appendChild(el);
  }
  root.style.width = `${maxX}px`;
  root.style.height = `${y}px`;
  svg.setAttribute("width", maxX);
  svg.setAttribute("height", y);
  // Signals: from each gene that writes one to each gene that reads it.
  const ends = new Map(), slot = (i, side) => { const k = `${i}${side}`, n = ends.get(k) || 0; ends.set(k, n + 1); return n; };
  for (let k = 0; k < g.keep.length; k++) {
    for (const w of g.genes.filter((x) => x.writes.includes(k))) {
      for (const r of g.genes.filter((x) => x.reads.includes(k) && x.index !== w.index)) {
        const a = gplaced.get(w.index), b = gplaced.get(r.index);
        // Left to right where it can: a wire back to an earlier column leaves the writer's left edge and
        // enters the reader's right edge; within a column it makes a bracket on the right.
        const back = a.x > b.x, same = a.x === b.x;
        const x0 = back ? a.x : a.x + BOX.w, x1 = back ? b.x + BOX.w : same ? b.x + BOX.w : b.x;
        const y0 = a.y + 14 + (slot(w.index, back ? "L" : "R") % 6) * 8, y1 = b.y + 14 + (slot(r.index, back ? "R" : same ? "R" : "L") % 6) * 8;
        const d = same ? 70 : Math.max(40, Math.abs(x1 - x0) / 2) * (back ? -1 : 1);
        const path = document.createElementNS(NS, "path");
        path.setAttribute("class", "wire");
        path.setAttribute("d", same ? `M${x0},${y0} C${x0 + d},${y0} ${x1 + d},${y1} ${x1},${y1}` : `M${x0},${y0} C${x0 + d},${y0} ${x1 - d},${y1} ${x1},${y1}`);
        path.setAttribute("stroke", wireColor(`s${k}`));
        path.dataset.from = w.index;
        path.dataset.to = r.index;
        const title = document.createElementNS(NS, "title");
        title.textContent = `signal s${k}${g.keep[k] ? ` (keeps ${g.keep[k]})` : ""}`;
        path.append(title);
        svg.appendChild(path);
        if (!back && !same) {
          const tx = document.createElementNS(NS, "text");
          tx.setAttribute("class", "wlabel");
          tx.setAttribute("x", x0 + 8);
          tx.setAttribute("y", y0 - 3);
          tx.textContent = `s${k}`;
          svg.appendChild(tx);
        }
      }
    }
  }
  const cam = cams.genome;
  if (cam.fit || cam.w !== maxX || cam.h !== y) { cam.w = maxX; cam.h = y; if (cam.fit) fitCam(cam); }
  if (isShown("genome")) applyCam(cam);
  if (genomeSel != null) selectGene(genomeSel);
}

function selectGene(i) {
  genomeSel = i;
  const g = genomeData, x = g && g.genes.find((q) => q.index === i);
  for (const el of $("genome").querySelectorAll(".gene")) el.classList.toggle("sel", +el.dataset.index === i);
  for (const p of $("genome").querySelectorAll(".wire")) {
    const on = x && (+p.dataset.from === i || +p.dataset.to === i);
    p.classList.toggle("hot", !!on);
    p.classList.toggle("dim", !!x && !on);
  }
  const picked = $("picked");
  picked.textContent = "";
  if (!x) { picked.textContent = "Click a gene."; return; }
  const small = document.createElement("small");
  small.textContent = `#${g.entity} ${g.lineage} · gene ${x.index} · module m${x.module}${x.active ? "" : x.expressed ? " (dormant module)" : " (dormant gene)"}`;
  const sig = (l) => (l.length ? l.map((k) => `s${k}`).join(", ") : "none");
  picked.append(small, document.createTextNode(`${x.title}: ${x.text}\n\nreads ${sig(x.reads)}\nwrites ${sig(x.writes)}`));
}

// A point of the picture as a point of the world: the map is the top left of the image, `map.w` by
// `map.h` pixels for the whole world.
function pointToWorld(clientX, clientY) {
  const m = info.map;
  if (!m || !isShown("picture")) return null;
  const r = stage.getBoundingClientRect(), cam = cams.picture;
  const px = (clientX - r.left - cam.x) / cam.s, py = (clientY - r.top - cam.y) / cam.s;
  if (px < 0 || py < 0 || px >= m.w || py >= m.h) return null;
  return { px, py, x: (px / m.w) * m.world_w, y: (py / m.h) * m.world_h };
}

const fmtU = (mu) => { const u = mu / 1000; return u >= 100 ? u.toFixed(0) : u >= 10 ? u.toFixed(1) : u.toFixed(3).replace(/0+$/, "").replace(/\.$/, ""); };

function showInfo(r, p, at) {
  const panel = $("infopanel");
  panel.textContent = "";
  panel.classList.toggle("pinned", !!info.pin);
  const h = document.createElement("h3");
  h.textContent = `tick ${r.tick} · (${r.x.toFixed(1)}, ${r.y.toFixed(1)}) · cell ${r.cell.x}, ${r.cell.y}`;
  panel.append(h);
  const cell = Object.entries(r.cell.amounts_mu);
  const t = document.createElement("table");
  if (!cell.length) { const tr = t.insertRow(); tr.insertCell().textContent = "the cell is empty"; }
  for (const [name, mu] of cell) { const tr = t.insertRow(); tr.insertCell().textContent = name; tr.insertCell().textContent = `${fmtU(mu)} u`; }
  panel.append(t);
  for (const e of r.creatures.slice(0, 5)) {
    const w = document.createElement("div");
    w.className = "who";
    const carried = Object.entries(e.carried_mu).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${k} ${fmtU(v)}`).join(", ");
    const l = document.createElement("div");
    l.textContent = `#${e.id} ${e.lineage} · age ${e.age} · ${e.active_genes} genes`;
    const c = document.createElement("div");
    c.className = "sub";
    c.textContent = `${e.distance.toFixed(1)} away${carried ? ` · carries ${carried}` : ""}`;
    w.append(l, c);
    if (info.pin) {
      const b = document.createElement("button");
      b.textContent = "Open genome";
      b.onclick = () => { wantEntity = e.id; info.pin = null; infoOff(); setMode("genome"); };
      w.append(b);
    }
    panel.append(w);
  }
  if (r.creatures_near > 5) { const m = document.createElement("div"); m.className = "sub"; m.textContent = `+ ${r.creatures_near - 5} more near`; panel.append(m); }
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = info.pin ? "click elsewhere to move · Esc or i to close" : "click to pin · i or Esc to close";
  panel.append(hint);
  panel.style.display = "block";
  // Beside the pointer, kept inside the window.
  const box = stage.getBoundingClientRect(), pw = panel.offsetWidth, ph = panel.offsetHeight;
  let x = at.x + 18, y = at.y + 18;
  if (x + pw > box.width - 8) x = at.x - pw - 18;
  if (y + ph > box.height - 8) y = Math.max(8, box.height - ph - 8);
  panel.style.left = `${Math.max(8, x)}px`;
  panel.style.top = `${Math.max(8, y)}px`;
}

async function askInfo(p, at) {
  const w = $("world").value, m = info.map;
  if (!w || !m || info.busy) return;
  info.busy = true;
  try {
    const radius = (m.world_w / m.grid_w) * 3;
    const r = await call("view.pick", { world: w, x: p.x, y: p.y, radius, limit: 6 });
    if (info.on && (info.pin || info.hover === p)) showInfo(r, p, at);
  } catch (e) {
    $("infopanel").textContent = String(e.message || e);
    $("infopanel").style.display = "block";
  } finally {
    info.busy = false;
  }
}

function hoverInfo(e) {
  if (!info.on || info.pin || drag || performance.now() - info.at < 90) return;
  const r = stage.getBoundingClientRect(), p = pointToWorld(e.clientX, e.clientY);
  if (!p) { info.hover = null; $("infopanel").style.display = "none"; placeMark(); return; }
  info.at = performance.now();
  info.hover = p;
  placeMark();
  askInfo(p, { x: e.clientX - r.left, y: e.clientY - r.top });
}

function pinInfo(e) {
  const r = stage.getBoundingClientRect(), p = pointToWorld(e.clientX, e.clientY);
  if (!p) return;
  info.pin = p;
  info.hover = null;
  placeMark();
  askInfo(p, { x: e.clientX - r.left, y: e.clientY - r.top });
}

function infoOff() {
  info.on = false;
  info.pin = info.hover = null;
  stage.classList.remove("picking");
  $("infobtn").classList.remove("on");
  $("infopanel").style.display = "none";
  placeMark();
}

function toggleInfo() {
  if (info.on) return infoOff();
  if (!isShown("picture")) setMode("picture");
  info.on = true;
  stage.classList.add("picking");
  $("infobtn").classList.add("on");
}

stage.addEventListener("pointermove", hoverInfo);
stage.addEventListener("pointerleave", () => { if (info.on && !info.pin) { info.hover = null; $("infopanel").style.display = "none"; placeMark(); } });
$("infobtn").onclick = toggleInfo;
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === "i" || e.key === "I") { e.preventDefault(); toggleInfo(); }
  else if (e.key === "Escape" && info.on) { if (info.pin) { info.pin = null; $("infopanel").style.display = "none"; placeMark(); } else infoOff(); }
});
// A pinned point follows the running world.
setInterval(() => { if (info.on && info.pin && isShown("picture")) { const r = stage.getBoundingClientRect(), at = toScreen(info.pin); askInfo(info.pin, { x: at.x, y: at.y }); } }, 1000);

function onFrame(buf) {
  const n = new DataView(buf).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
  if (!sub || header.subscription !== sub) return;
  info.map = header.map || null;
  const url = URL.createObjectURL(new Blob([new Uint8Array(buf, 4 + n)], { type: "image/png" }));
  const img = $("frame");
  img.onload = () => {
    if (shown) URL.revokeObjectURL(shown);
    shown = url;
    // A new picture size (another world or view) fits the window again; the same size keeps the camera.
    const cam = cams.picture;
    if (cam.fit || cam.w !== img.naturalWidth || cam.h !== img.naturalHeight) { cam.w = img.naturalWidth; cam.h = img.naturalHeight; fitCam(cam); }
    applyCam(cam);
  };
  img.src = url;
  if (isShown("picture")) {
    img.style.display = "block";
    $("empty").style.display = "none";
  }
  $("where").textContent = `${header.world} · tick ${header.tick} · revision ${header.revision}`;
}

const viewNames = (src) => [...src.matchAll(/^view\s+(\w+)\s+for\s+\w+/gm)].map((m) => m[1]);

// A list that was asked for before a newer one is dropped when it arrives, so a slow poll cannot put
// the selection back on an older world.
let worldGen = 0;
async function refreshWorlds(select) {
  const gen = ++worldGen;
  const { worlds } = await call("world.list");
  if (gen !== worldGen) return worlds;
  const sel = $("world"), keep = select || sel.value;
  const cwPrev = $("code-world").value;
  sel.innerHTML = worlds.map((w) => `<option value="${w.world}">${w.world}: ${w.lineages.join(", ")}${w.backend && w.backend !== "cpu" ? ` [${w.backend}]` : ""}${w.running ? " (running)" : ""}</option>`).join("");
  if (worlds.some((w) => w.world === keep)) sel.value = keep;
  const cw = $("code-world");
  cw.innerHTML = sel.innerHTML;
  cw.value = codeonly && worlds.some((w) => w.world === cwPrev) ? cwPrev : sel.value;
  return worlds;
}

async function refreshViews() {
  const w = $("world").value;
  if (!w) return;
  const { source } = await call("world.source", { world: w });
  const own = viewNames(source), extra = viewNames(example.views).filter((v) => !own.includes(v));
  const prev = $("view").value;
  $("view").innerHTML = [...own.map((v) => `<option>${v}</option>`), ...extra.map((v) => `<option>${v}</option>`)].join("");
  $("view").value = [...own, ...extra].includes(prev) ? prev : (extra[0] || own[0] || "");
}

async function subscribe() {
  oops();
  const world = $("world").value, view = $("view").value;
  if (!world || !view) return;
  if (sub) { await call("view.unsubscribe", { subscription: sub }).catch(() => {}); sub = null; }
  const charts = $("charts").checked ? ["default"] : [];
  const r = await call("view.subscribe", { world, view, views: example.views, charts, every: +$("every").value || 1, max_fps: +$("fps").value || 8 });
  sub = r.subscription;
}

async function stats() {
  const world = $("world").value;
  if (!world) return;
  const s = await call("stats.query", { world });
  const by = Object.entries(s.population_by_lineage || {}).map(([k, v]) => `  ${k}: ${v}`).join("\n");
  $("stats").textContent = `tick ${s.tick}\npopulation ${s.population}\n${by}\nbirths ${s.births}  deaths ${s.deaths}`;
}

// The worlds to start from (`docs.examples`): the reference dish, Game of Life, the test-9 dish. The
// lineage boxes and the grid size follow the one chosen.
let examples = [];
function chosenExample() {
  return examples.find((x) => x.id === $("example").value) || examples[0];
}
function renderExample() {
  const x = chosenExample();
  if (!x) return;
  $("lins").textContent = "";
  for (const name of x.lineages) {
    const l = document.createElement("label"), i = document.createElement("input");
    i.type = "checkbox";
    i.checked = true;
    i.dataset.name = name;
    l.append(i, document.createTextNode(` ${name}`));
    $("lins").append(l);
  }
  $("size").parentElement.style.display = x.resizable ? "" : "none";
  $("example").title = x.about;
}
async function loadExamples() {
  examples = (await call("docs.examples")).examples;
  $("example").textContent = "";
  for (const x of examples) {
    const o = document.createElement("option");
    o.value = x.id;
    o.textContent = x.name;
    $("example").append(o);
  }
  renderExample();
}
$("example").onchange = renderExample;

async function create() {
  oops();
  const x = chosenExample();
  if (!x) return oops("the examples have not loaded");
  const lineages = [...$("lins").querySelectorAll("input")].filter((i) => i.checked).map((i) => i.dataset.name);
  if (x.lineages.length && !lineages.length) return oops("pick at least one lineage");
  example = { source: x.source, views: x.views };
  const size = $("size").value;
  let source = x.source;
  if (x.resizable && size !== "256") source = source.replace("Grid(w: 256, h: 256)", `Grid(w: ${size}, h: ${size})`).replace(/count: 2_000;/g, "count: 300;");
  const { world } = await call("world.create", { source, lineages, seed: +$("seed").value || 1, backend: $("backend").value });
  await refreshWorlds(world);
  await refreshViews();
  await subscribe();
  await stats();
  if (isShown("graph")) { await loadGraph(); if (cams.graph.fit) fitCam(cams.graph); applyCam(cams.graph); }
}

function connect() {
  if (!token) return say("no token: open the address the server printed", "bad");
  ws = new WebSocket(`ws://${location.host}/`, [`emerge.k.${token}`]);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (m) => {
    if (typeof m.data !== "string") return onFrame(m.data);
    const r = JSON.parse(m.data), p = pending.get(r.id);
    if (!p) return;
    pending.delete(r.id);
    r.error ? p.reject(new Error(r.error.message)) : p.resolve(r.result);
  };
  ws.onopen = async () => {
    leaving = null;
    say("connected", "ok");
    example = await call("docs.example");
    await loadExamples();
    const worlds = await refreshWorlds();
    if (codeonly) await loadCode();
    else if (worlds.length) { await refreshViews(); await subscribe(); await stats(); if (codeOpen()) await loadCode(); }
    clearInterval(poll);
    poll = setInterval(() => {
      stats().catch(() => {});
      refreshWorlds().then((ws) => {
        const w = ws.find((x) => x.world === $("world").value);
        if (isShown("graph") && w && w.revision !== graphRev) loadGraph().catch(() => {});
        if (isShown("genome") && ++genomeTick % 3 === 0) loadGenome(true).catch(() => {});
        const cw = ws.find((x) => x.world === codeWorld());
        if (codeOpen() && cw && (cw.world !== codeWorldName || cw.revision !== codeRev)) loadCode().catch(() => {});
      }).catch(() => {});
    }, 1000);
  };
  ws.onclose = () => {
    clearInterval(poll);
    sub = null;
    pending.clear();
    if (leaving === "stop") return say("server stopped: close this tab, or run `agentsrule web` again", "bad");
    say(leaving === "restart" ? "restarting…" : "disconnected", "bad");
    if (leaving === "restart") setTimeout(connect, 500);
  };
  ws.onerror = () => say("refused: the token or the address is wrong", "bad");
}

$("create").onclick = () => create().catch(oops);
$("world").onchange = () => refreshViews().then(subscribe).then(stats).then(() => (isShown("graph") ? loadGraph() : isShown("genome") ? loadEntities().then(() => loadGenome()) : null)).then(() => loadCode()).catch(oops);
$("view").onchange = $("every").onchange = $("fps").onchange = $("charts").onchange = () => subscribe().catch(oops);
$("play").onclick = () => call("run.resume", { world: $("world").value }).then(() => refreshWorlds()).catch(oops);
$("pause").onclick = () => call("run.pause", { world: $("world").value }).then(() => refreshWorlds()).catch(oops);
$("step").onclick = () => call("run.step", { world: $("world").value, ticks: +$("steps").value || 1 }).then(stats).catch(oops);
// Stop and restart end the process, so the answer may be a closing socket. The token survives a
// restart (`agentsrule web` hands it to each new server), so the page reconnects by itself.
const leave = (how, ask) => {
  if (!confirm(ask)) return;
  leaving = how;
  call("server." + how).catch(() => {});
};
$("restart").onclick = () => leave("restart", "Restart the server? Worlds in memory are lost.");
$("stop").onclick = () => leave("stop", "Stop the server? Worlds in memory are lost.");
connect();
</script>
</body>
</html>
